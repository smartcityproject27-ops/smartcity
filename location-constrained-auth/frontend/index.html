<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Location-constrained Auth Demo</title>
    <style>
      /* Reset */
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body > h1 {
        /* background-color: red; */
        color: yellow;
        /* color: green; */
        margin-right: 12px;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #6a11cb, #2575fc);
        /* background-color: black; */
        color: #333;
        /* color: green; */
        min-height: 100vh;
        /* display: flex; */
        justify-content: center;
        align-items: center;
        padding: 20px;
        margin-left: 500px;
      }

      .container {
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        padding: 30px;
        width: 100%;
        max-width: 400px;
      }

      h2 {
        text-align: center;
        margin-bottom: 20px;
        color: #2575fc;
      }

      form {
        display: flex;
        flex-direction: column;
      }

      input {
        margin-bottom: 15px;
        padding: 12px;
        border-radius: 6px;
        border: 1px solid #ccc;
        font-size: 16px;
        transition: 0.3s;
      }

      input:focus {
        border-color: #2575fc;
        outline: none;
        box-shadow: 0 0 5px rgba(37, 117, 252, 0.5);
      }

      button {
        padding: 12px;
        background: #2575fc;
        color: white;
        font-size: 16px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        transition: 0.3s;
      }

      button:hover {
        background: #1a5edb;
      }

      pre {
        background: #f4f4f4;
        padding: 15px;
        border-radius: 8px;
        margin-top: 20px;
        font-size: 14px;
        overflow-x: auto;
      }

      @media (max-width: 480px) {
        .container {
          padding: 20px;
        }

        input,
        button {
          font-size: 14px;
        }
      }
    </style>
  </head>
  <body>
    <h1>Location Based Auth Sys</h1>
    <div class="container">
      <h2>Register</h2>
      <form id="reg">
        <input name="name" placeholder="Name" /><br />
        <input name="email" placeholder="Email" /><br />
        <input name="password" placeholder="Password" type="password" /><br />
        <button>Register</button>
      </form>

      <h2>Login</h2>
      <form id="login">
        <input name="email" placeholder="Email" /><br />
        <input name="password" placeholder="Password" type="password" /><br />
        <button>Login</button>
      </form>

      <pre id="out"></pre>
    </div>

    <script>
      const out = document.getElementById("out");
      const API = "http://localhost:8000/api/auth";

      async function handleFormSubmit(e, url) {
        e.preventDefault();
        const form = new FormData(e.target);
        const body = {};
        form.forEach((value, key) => (body[key] = value));

        try {
          const r = await fetch(API + url, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body),
          });
          const data = await r.json();
          out.textContent = JSON.stringify(data, null, 2);
        } catch (err) {
          out.textContent = "Error: " + err.message;
        }
      }

      document
        .getElementById("reg")
        .addEventListener("submit", (e) => handleFormSubmit(e, "/register"));
      document
        .getElementById("login")
        .addEventListener("submit", (e) => handleFormSubmit(e, "/login"));
    </script>
  </body>
</html>
